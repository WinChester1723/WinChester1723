<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Pasha Pashazade — Senior Software Engineer</title>
  <desc id="d">Dynamics 365 Finance and Operations, C#/.NET integrations, Azure DevOps. A build pipeline runs: build, test, package, deploy.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="50%" cy="45%" r="65%">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
    .name { font-size: 54px; font-weight: 700; fill: #e6eaf2; letter-spacing: -1.5px; }
    .role { font-size: 22px; font-weight: 500; fill: #e6eaf2; }
    .sep  { fill: #7fb0ff; }
    .meta { font-size: 14px; fill: #6f7b91; }
    .tag  { font-size: 15px; fill: #a3aec2; }
    .stage-label { font-size: 12px; fill: #a3aec2; }
    .dot-ok { fill: #5bd69b; }

    /* Entry: rise + fade, staggered — transform/opacity only */
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .10s } .d2 { animation-delay: .25s } .d3 { animation-delay: .40s } .d4 { animation-delay: .55s }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .rule { transform-origin: 64px 0; transform: scaleX(0); animation: draw 1.2s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes draw { to { transform: scaleX(1); } }

    /* Rotating focus line: three phrases, 9s loop, crossfade */
    .ph { opacity: 0; animation: phrase 9s ease-in-out infinite; }
    .ph2 { animation-delay: 3s } .ph3 { animation-delay: 6s }
    @keyframes phrase {
      0%       { opacity: 0; transform: translateY(6px); }
      4%, 31%  { opacity: 1; transform: none; }
      34%, 100%{ opacity: 0; transform: translateY(-6px); }
    }

    /* Pipeline: stages light up in sequence, 6s loop */
    .stage rect { fill: #0f1627; stroke: #94a3b8; stroke-opacity: .22; }
    .stage .lit { fill: #3b82f6; fill-opacity: .14; stroke: #3b82f6; stroke-opacity: .7; opacity: 0; animation: lit 6s ease-in-out infinite; }
    .s2 .lit { animation-delay: .9s } .s3 .lit { animation-delay: 1.8s } .s4 .lit { animation-delay: 2.7s }
    @keyframes lit { 0% { opacity: 0 } 8%, 60% { opacity: 1 } 80%, 100% { opacity: 0 } }
    .flow { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; opacity: .55; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .pulse { transform-origin: center; transform-box: fill-box; animation: pulse 2.6s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .5 } 70%,100% { transform: scale(2.6); opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .ph1, .rule, .stage .lit { animation: none; opacity: 1; transform: none; }
      .ph2, .ph3, .pulse { display: none; }
      .flow { animation: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0a0f1c"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#94a3b8" stroke-opacity="0.16"/>

  <!-- Identity -->
  <g class="rise d1">
    <circle cx="70" cy="62" r="3.5" class="dot-ok"/>
    <circle cx="70" cy="62" r="3.5" class="dot-ok pulse"/>
    <text x="84" y="67" class="mono meta">Baku, Azerbaijan · GMT+4</text>
  </g>
  <text x="64" y="128" class="sans name rise d2">Pasha Pashazade</text>
  <text x="64" y="166" class="sans role rise d3">Senior Software Engineer <tspan class="sep">|</tspan> Dynamics 365 F&amp;O <tspan class="sep">·</tspan> C#/.NET <tspan class="sep">·</tspan> Azure</text>
  <rect x="64" y="186" width="420" height="2" fill="url(#rule)" class="rule"/>

  <!-- Rotating focus -->
  <g class="mono tag rise d4">
    <text x="64" y="226" class="ph ph1">&gt; ERP extensions in X++ — Chain of Command, event handlers, SSRS</text>
    <text x="64" y="226" class="ph ph2">&gt; Integrations with banks and external systems — REST, OData, SOAP</text>
    <text x="64" y="226" class="ph ph3">&gt; From requirements to production — Azure DevOps pipelines, LCS</text>
  </g>

  <!-- Pipeline -->
  <!-- position on the outer group: a CSS transform animation would override the attribute -->
  <g transform="translate(760 222)"><g class="rise d4">
    <line x1="58" y1="0" x2="362" y2="0" class="flow"/>
    <g class="stage s1" transform="translate(0 -15)">
      <rect width="80" height="30" rx="6"/><rect width="80" height="30" rx="6" class="lit"/>
      <text x="40" y="19.5" text-anchor="middle" class="mono stage-label">build</text>
    </g>
    <g class="stage s2" transform="translate(110 -15)">
      <rect width="80" height="30" rx="6"/><rect width="80" height="30" rx="6" class="lit"/>
      <text x="40" y="19.5" text-anchor="middle" class="mono stage-label">test</text>
    </g>
    <g class="stage s3" transform="translate(220 -15)">
      <rect width="80" height="30" rx="6"/><rect width="80" height="30" rx="6" class="lit"/>
      <text x="40" y="19.5" text-anchor="middle" class="mono stage-label">package</text>
    </g>
    <g class="stage s4" transform="translate(330 -15)">
      <rect width="80" height="30" rx="6"/><rect width="80" height="30" rx="6" class="lit"/>
      <text x="40" y="19.5" text-anchor="middle" class="mono stage-label">deploy</text>
    </g>
  </g></g>
</svg>
