<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" role="img" aria-labelledby="t">
  <title id="t">OcelotDemo: API gateway routing to a downstream service with Ocelot</title>
  <defs>
    <radialGradient id="g" cx="100%" cy="0%" r="90%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.16"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .draw { transform: scaleX(0); animation: draw 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes draw { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .draw { animation: none; opacity: 1; transform: none; }
    }

    .name { font-size: 18px; font-weight: 600; fill: #e6eaf2; }
    .desc { font-size: 15px; fill: #a3aec2; }
    .chip { fill: #94a3b8; fill-opacity: .07; stroke: #94a3b8; stroke-opacity: .22; }
    .chip-t { font-size: 12px; fill: #a3aec2; }
    .icon { fill: none; stroke: #7fb0ff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #6f7b91; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .rule { transform-origin: 24px 0; }
  </style>
  <rect width="440" height="176" rx="14" fill="#0f1627"/>
  <rect width="440" height="176" rx="14" fill="url(#g)"/>
  <rect x=".5" y=".5" width="439" height="175" rx="13.5" fill="none" stroke="#94a3b8" stroke-opacity=".16"/>
  <g class="rise" style="animation-delay:0.08s">
    <g transform="translate(24 24)"><rect width="32" height="32" rx="8" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-opacity=".38"/>
      <g transform="translate(5 5) scale(.917)" class="icon"><path d="M3 12h6"/><path d="M15 6h6"/><path d="M15 12h6"/><path d="M15 18h6"/><path d="M9 12l6-6M9 12h6M9 12l6 6"/></g></g>
    <text x="68" y="46" class="mono name">OcelotDemo</text>
    <g transform="translate(400 32)" class="arrow"><path d="M2 14L14 2M5 2h9v9"/></g>
  </g>
  <rect x="24" y="68" width="160" height="1.5" fill="url(#rule)" class="draw rule" style="animation-delay:0.33s"/>
  <g class="rise" style="animation-delay:0.23s"><text x="24" y="92" class="sans desc">API gateway routing to a downstream</text><text x="24" y="114" class="sans desc">service with Ocelot</text></g>
  <g class="rise" style="animation-delay:0.38s"><g transform="translate(24 134)"><rect width="70" height="24" rx="5" class="chip"/><text x="35" y="16.5" text-anchor="middle" class="mono chip-t">Ocelot</text></g><g transform="translate(102 134)"><rect width="115" height="24" rx="5" class="chip"/><text x="58" y="16.5" text-anchor="middle" class="mono chip-t">ASP.NET Core</text></g><g transform="translate(225 134)"><rect width="77" height="24" rx="5" class="chip"/><text x="39" y="16.5" text-anchor="middle" class="mono chip-t">Swagger</text></g></g>
</svg>
